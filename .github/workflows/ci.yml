name: CI

# Runs the checks that can be trusted without a human: the test suites, the linter, the production
# build, and the Asset Gate E technical criterion (which also fails when a gate document cites
# evidence files that are missing from the repository).
#
# The Gate E responsive criterion is NOT run here: it needs a built app, a running server and a
# browser. Run it on demand before changing a gate verdict:
#   npm run build && npm run start -- --port 3000 &
#   BASE_URL=http://127.0.0.1:3000 npm run gate:responsive

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test (scoring, resolver, Core 2 pilot, Asset Gate E)
        run: npm test

      - name: Build
        run: npm run build
